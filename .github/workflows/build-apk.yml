name: Build PocketPal Plus APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Create dummy google-services.json
        run: |
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy",
              "storage_bucket": "://appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly1234567890"}]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "com.pocketpalai.e2e"
                  }
                },
                "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly1234567890"}]
              }
            ]
          }
          EOF

      - name: Build Prod Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleProdDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-Plus-APK
          path: android/app/build/outputs/apk/prod/debug/*.apk
